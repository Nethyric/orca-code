[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "orca-code"
version = "2.0.0a1"
description = "The zero-dependency AI coding agent — your keys, your providers, your budget."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Nethyric" }]
keywords = ["ai", "agent", "coding", "terminal", "cli"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Code Generators",
]
dependencies = []

[project.scripts]
orca = "orca.cli:main"

[tool.setuptools]
packages = ["orca", "orca.core", "orca.providers", "orca.tools", "orca.policy", "orca.runtime", "orca.ui"]
