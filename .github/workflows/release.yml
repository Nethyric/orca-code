name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

defaults:
  run:
    shell: bash

env:
  PYINSTALLER: "pyinstaller>=6.11"

jobs:
  binary:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-latest
            python: "3.12"
            archive: tar.gz
          - name: linux-arm64
            os: ubuntu-24.04-arm
            python: "3.12"
            archive: tar.gz
          - name: macos-x64
            os: macos-13
            python: "3.12"
            archive: tar.gz
          - name: macos-arm64
            os: macos-latest
            python: "3.12"
            archive: tar.gz
          - name: windows-x64
            os: windows-latest
            python: "3.12"
            archive: exe
          - name: windows-arm64
            os: windows-11-arm
            python: preinstalled
            archive: exe
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        if: matrix.python != 'preinstalled'
        with:
          python-version: ${{ matrix.python }}

      - name: Show toolchain
        run: |
          python --version
          python -c "import sys; assert sys.version_info >= (3, 9), 'needs 3.9+'"

      - name: Install PyInstaller
        run: python -m pip install --upgrade "$PYINSTALLER"

      - name: Build binary
        run: |
          python -m PyInstaller --onefile --clean --name orca --paths . \
            --distpath dist-bin --workpath build --specpath build \
            packaging/launcher.py

      - name: Smoke test (offline)
        run: |
          set -e
          expected="orca-code $(python -c 'from orca.config import VERSION; print(VERSION)')"
          actual="$(dist-bin/orca --version | tr -d '\r')"
          echo "expected: $expected / got: $actual"
          [ "$actual" = "$expected" ]
          dist-bin/orca --help > /dev/null
          dist-bin/orca auth list > /dev/null
          echo "smoke: OK"

      - name: Package (tar.gz)
        if: matrix.archive == 'tar.gz'
        run: |
          mkdir -p stage dist
          cp dist-bin/orca LICENSE README.md stage/
          tar -czf "dist/orca-${{ matrix.name }}.tar.gz" -C stage .

      - name: Package (exe)
        if: matrix.archive == 'exe'
        run: |
          mkdir -p dist
          cp dist-bin/orca.exe "dist/orca-${{ matrix.name }}.exe"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: orca-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Assemble and publish
    needs: binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run test suite on the tagged commit
        run: python -m unittest discover -s tests -v

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          path: assets
          pattern: orca-*
          merge-multiple: true

      - name: Build orca.pyz (anywhere with Python 3.9+)
        run: python packaging/build_pyz.py --out assets/orca.pyz

      - name: Build wheel
        run: python -m pip wheel . --no-deps -w assets

      - name: Checksums
        run: |
          cd assets
          ls -la
          sha256sum * > ../sha256sums.txt
          mv ../sha256sums.txt .
          cat sha256sums.txt

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          gh release create "$tag" assets/* --title "$tag" \
            --notes-file packaging/release-notes.md
