<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Orca Code logo">
  <!-- Deep Ocean tile: readable on light & dark backgrounds -->
  <defs>
    <linearGradient id="ocean" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e4c6b"/>
      <stop offset="1" stop-color="#082b40"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#ocean)"/>
  <!-- rising bubbles -->
  <circle cx="24" cy="30" r="3" fill="#67e8f9" opacity="0.35"/>
  <circle cx="34" cy="20" r="2" fill="#67e8f9" opacity="0.25"/>
  <circle cx="106" cy="98" r="2.5" fill="#67e8f9" opacity="0.2"/>
  <!-- orca body -->
  <path d="M20 76 C30 50 62 40 86 48 C102 53 112 64 114 74 C104 82 88 88 70 88 C52 88 34 86 20 76 Z" fill="#0b1f2c"/>
  <!-- white eye patch + belly -->
  <path d="M86 52 C96 54 104 61 108 68 C100 66 92 60 86 52 Z" fill="#e8f6fb"/>
  <path d="M26 77 C40 85 58 89 74 89 C60 92 40 90 26 77 Z" fill="#e8f6fb" opacity="0.9"/>
  <!-- eye -->
  <circle cx="97" cy="61" r="2.4" fill="#082b40"/>
  <!-- dorsal fin -->
  <path d="M52 46 C54 36 60 30 66 28 C64 36 62 42 60 48 Z" fill="#0b1f2c"/>
  <!-- tail flukes -->
  <path d="M114 74 C120 70 124 64 124 58 C118 62 114 66 112 70 Z" fill="#0b1f2c" opacity="0.9"/>
  <!-- prompt caret: the "code" in Orca Code -->
  <path d="M36 104 L44 112 L36 120" stroke="#38d9f0" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M54 118 L72 118" stroke="#38d9f0" stroke-width="5" stroke-linecap="round"/>
</svg>
